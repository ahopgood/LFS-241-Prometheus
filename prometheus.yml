# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "demo"
    static_configs:
      - targets:
        - 'demo1:8080'
        - 'demo2:8080'
        - 'demo3:8080' # using hostname from docker run / docker-compose for discovery

  - job_name: "node"
    static_configs:
      - targets: ['host.docker.internal:9100'] # node-exporter uses host networking; Colima forwards the port to the Mac host

  - job_name: "cadvisor"
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: "instrumentation-example"
    static_configs:
      - targets: ['lab-app:12345']

  - job_name: "cpu-exporter"
    static_configs:
      - targets: ['cpu-exporter:8000']