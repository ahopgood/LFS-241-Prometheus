services:
  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - 9091:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - lab

  demo: &demo1
    image: demo
    hostname: demo1
    ports:
      - 8084:8080
    networks:
      - lab
  demo2:
    <<: *demo1
    hostname: demo2
    ports:
      - 8085:8080
  demo3:
    <<: *demo1
    hostname: demo3
    ports:
      - 8086:8080

networks:
  lab:
    driver: bridge
