services:
  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    container_name: prometheus
    hostname: prometheus
    ports:
      - 9091:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./targets.yml:/etc/prometheus/targets.yml
    networks:
      - lab

  grafana:
    image: docker.io/grafana/grafana:11.6.0
    container_name: grafana
    hostname: grafana
    ports:
      - 3000:3000
    networks:
      - lab
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/

  demo: &demo1
    image: demo
    hostname: demo1
    ports:
      - 8084:8080
    networks:
      - lab
  demo2:
    <<: *demo1
    hostname: demo2
    ports:
      - 8085:8080
  demo3:
    <<: *demo1
    hostname: demo3
    ports:
      - 8086:8080

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.1
    container_name: node-exporter
    hostname: node-exporter
    ports:
      - 9101:9100 # was clashing with local sonarqube on port 9100
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave

  cAdvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cAdvisor
    hostname: cAdvisor
    ports:
      - 8081:8080
    networks:
      - lab
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  lab-app:
    image: lab-app
    hostname: lab-app
    ports:
      - 8087:12345
    networks:
      - lab

  cpu-exporter:
    image: cpu-exporter
    hostname: cpu-exporter
    pid: host
    environment:
      LC_ALL: "C"
    ports:
      - 8089:8000
    networks:
      - lab

  consul:
    image: docker.io/hashicorp/consul:1.20
    hostname: consul
    ports:
      - "8500:8500"
    command:
      - "agent"
      - "-bind=0.0.0.0"
      - "-client=0.0.0.0"
      - "-dev"
      - "-config-file=/etc/consul/demo-service.json"
    volumes:
      - ./demo-service.json:/etc/consul/demo-service.json
    networks:
        - lab

networks:
  lab:
    driver: bridge
